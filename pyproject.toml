[project]
name = "acepatchindo"
version = "1.4.12"
description = "Honor of Kings Ace (Wangzhe Wanxiang Qi / WXQ) Indonesian Localization Patcher & Builder"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "lz4>=4.3.3",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "extracted_source"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
]

